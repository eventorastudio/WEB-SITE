<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventora Studio | Panel Administrativo</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- Capa protectora inicial (Auth Guard) -->
    <div id="auth-guard" class="auth-guard"></div>

    <!-- Fondo Premium (Luces y desenfoques) -->
    <div class="premium-bg">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
    </div>

    <div class="dashboard-wrapper" id="dashboard-content">
        
        <!-- HEADER PREMIUM -->
        <header class="dashboard-header anim-stagger">
            <div class="header-left">
                <!-- El logo se inyecta desde config.js -->
                <img src="" alt="Eventora Studio" class="logo" id="ui-logo">
                <div class="header-divider"></div>
                <div class="header-titles">
                    <span class="studio-name">Eventora Studio</span>
                    <span class="panel-name">Panel Administrativo</span>
                </div>
            </div>
            
            <div class="header-right">
                <div class="user-profile" id="user-profile-trigger">
                    <div class="user-info">
                        <span class="user-name" id="display-user-name">Administrador</span>
                        <span class="user-role">Administrador</span>
                    </div>
                    <div class="avatar" id="user-avatar">A</div>
                    <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                    
                    <!-- Menú Desplegable -->
                    <div class="dropdown-menu" id="user-dropdown">
                        <div class="dropdown-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            Mi perfil
                        </div>
                        <div class="dropdown-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            Configuración
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item logout-item" id="btn-logout">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            Cerrar sesión
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="dashboard-main">
            <!-- HERO WELCOME PREMIUM -->
            <section class="welcome-hero anim-stagger" id="welcome-section">
                <!-- Se inyecta desde JS -->
            </section>

            <!-- STATS CARDS -->
            <section class="stats-grid anim-stagger" id="stats-container">
                <!-- Skeleton Loading de Estadísticas -->
                <div class="stat-card skeleton-container">
                    <div class="skeleton-icon skeleton"></div>
                    <div class="skeleton-number skeleton"></div>
                    <div class="skeleton-text skeleton"></div>
                    <div class="skeleton-text-sm skeleton"></div>
                </div>
                <div class="stat-card skeleton-container">
                    <div class="skeleton-icon skeleton"></div>
                    <div class="skeleton-number skeleton"></div>
                    <div class="skeleton-text skeleton"></div>
                    <div class="skeleton-text-sm skeleton"></div>
                </div>
                <div class="stat-card skeleton-container">
                    <div class="skeleton-icon skeleton"></div>
                    <div class="skeleton-number skeleton"></div>
                    <div class="skeleton-text skeleton"></div>
                    <div class="skeleton-text-sm skeleton"></div>
                </div>
                <div class="stat-card skeleton-container">
                    <div class="skeleton-icon skeleton"></div>
                    <div class="skeleton-number skeleton"></div>
                    <div class="skeleton-text skeleton"></div>
                    <div class="skeleton-text-sm skeleton"></div>
                </div>
            </section>

            <!-- MAIN ACTION -->
            <section class="actions-section anim-stagger">
                <button id="btn-create-event" class="btn-primary ripple">
                    <span class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </span>
                    <span>Crear nuevo evento</span>
                </button>
            </section>

            <!-- RECENT EVENTS LIST -->
            <section class="events-section anim-stagger">
                <h2 class="section-title">Eventos recientes</h2>
                
                <div id="events-container" class="events-grid">
                    <!-- Skeleton Loading de Eventos (Tarjetas) -->
                    <div class="event-card skeleton-container">
                        <div class="event-card-header">
                            <div class="skeleton-badge skeleton"></div>
                            <div class="skeleton-date skeleton"></div>
                        </div>
                        <div class="event-card-body">
                            <div class="skeleton-title skeleton"></div>
                            <div class="skeleton-subtitle skeleton"></div>
                        </div>
                        <div class="event-card-footer">
                            <div class="skeleton-btn skeleton"></div>
                            <div class="skeleton-btn skeleton"></div>
                        </div>
                    </div>
                    
                    <div class="event-card skeleton-container">
                        <div class="event-card-header">
                            <div class="skeleton-badge skeleton"></div>
                            <div class="skeleton-date skeleton"></div>
                        </div>
                        <div class="event-card-body">
                            <div class="skeleton-title skeleton"></div>
                            <div class="skeleton-subtitle skeleton"></div>
                        </div>
                        <div class="event-card-footer">
                            <div class="skeleton-btn skeleton"></div>
                            <div class="skeleton-btn skeleton"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Módulo principal del Dashboard -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
