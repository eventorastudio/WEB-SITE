<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventora Studio | Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- Contenido del Dashboard básico -->
    <div class="dashboard-container" id="dashboard-content" style="display: none;">
        
        <!-- Cambiar por la ruta real del logotipo de Eventora Studio configurada en config.js -->
        <img src="assets/logo-eventora.png" alt="Eventora Studio" class="logo" id="ui-logo">
        
        <div class="studio-name">Eventora Studio</div>
        <h1 class="title">Panel Administrativo</h1>
        <p class="welcome-msg">Bienvenido nuevamente.</p>
        
        <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
        
    </div>

    <!-- Módulo principal del Dashboard -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
