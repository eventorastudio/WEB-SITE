<!doctype html>

<body data-portal-page="actividad"><div id="portal-loading" class="portal-gate"><p class="eyebrow">VALIDANDO HISTORIAL…</p></div><div id="portal-gate" class="portal-gate" hidden></div><div id="portal-content" class="portal-shell" hidden>
